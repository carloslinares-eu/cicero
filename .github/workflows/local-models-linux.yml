# End to end on Linux: Cicero installs its own Ollama, downloads a model and translates a presentation,
# on Debian and Fedora as a user would have them. These machines have no graphics card, so the model runs
# on the processor (slowly, which is fine here). Runs when the local-model code changes, or by hand.
name: Local models on Linux

on:
  push:
    paths:
      - "cicero/core/local/**"
      - "scripts/check_local_model.py"
      - ".github/workflows/local-models-linux.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Model key from cicero/core/local/catalog.py"
        default: translategemma-4b

jobs:
  end-to-end:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            setup: apt-get update && apt-get install -y python3 python3-venv python3-tk ca-certificates
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y python3 python3-tkinter ca-certificates
    steps:
      - uses: actions/checkout@v5
      - name: Install Python (as a user would)
        run: ${{ matrix.setup }}
      - name: Install Cicero
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -r requirements.txt
      - name: Install the engine, download the model, translate, check
        shell: bash
        # The last lines of a failure are repeated as annotations, readable without signing in to GitHub.
        run: |
          set -o pipefail
          /opt/venv/bin/python scripts/check_local_model.py ${{ github.event.inputs.model || 'translategemma-4b' }} \
            --managed 2>&1 | tee check.log || { grep -v " INFO " check.log | tail -n 10 | sed "s/^/::error::/"; exit 1; }
