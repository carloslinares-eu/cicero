[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cicero-translator"
dynamic = ["version"]
description = "Translate PowerPoint presentations, Word documents and PDFs with Google Cloud Translation or DeepL, keeping their formatting."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Linares" }]
keywords = ["powerpoint", "pptx", "word", "docx", "pdf", "translation", "google cloud translation", "deepl", "tkinter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "google-cloud-translate>=3.28,<4",
    "python-pptx>=1.0.2,<2",
    "python-docx>=1.2,<2",
    "pymupdf>=1.26,<3",
    "deepl>=1.20,<2",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pillow>=10.0",       # scripts/generate_icon.py
    "pyinstaller>=6.22",  # packaging/cicero.spec
]

[project.gui-scripts]
cicero = "cicero.app:main"

[project.urls]
Homepage = "https://github.com/carloslinares-eu/cicero"

[tool.setuptools.dynamic]
version = { attr = "cicero.__version__" }

[tool.setuptools.packages.find]
include = ["cicero*"]

[tool.setuptools.package-data]
cicero = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
